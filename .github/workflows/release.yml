# Release: baut den Windows-Installer (NSIS) und hängt ihn an ein GitHub-Release.
# Auslöser: "Run workflow" mit Version (empfohlen, nutzt den Cache von main) oder Tag v*.
# Normale Pushes lösen nichts aus. Keine Tests, kein Linting: geprüft wird lokal (siehe CLAUDE.md).
# Kein Testbuild vor dem Release nötig: schlägt der Build fehl, entsteht kein Release.
# Kosten: Repo privat → GitHub Free hat 2.000 Minuten/Monat, Windows-Minuten zählen doppelt.
# Ein Lauf mit warmem Cache braucht etwa 6–10 Min. Release-Dateien kosten keinen Speicher.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version für das Release, z. B. v0.1.0. Leer = nur Testbuild (Artefakt, 1 Tag), kein Release."
        required: false
        default: ""

permissions:
  contents: write

# Neuer Start bricht einen laufenden Build ab, spart Minuten bei schnellen Bugfixes.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    # Hängt etwas, bricht der Lauf ab statt Minuten zu verbrauchen.
    timeout-minutes: 30
    defaults: { run: { working-directory: app } }
    env:
      VERSION_TAG: ${{ inputs.version || github.ref_name }}
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/') || inputs.version != '' }}
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      # Optional: Code-Signatur (Secrets WINDOWS_CERTIFICATE = base64 einer .pfx, WINDOWS_CERTIFICATE_PASSWORD).
      # Ohne Secrets wird unsigniert gebaut, Windows SmartScreen warnt dann beim Setup.
      WIN_CERT: ${{ secrets.WINDOWS_CERTIFICATE }}
      WIN_CERT_PASS: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      # Defender-Echtzeitscan aus: spart auf dem Runner spürbar Zeit beim Kompilieren und npm ci.
      - name: Virenscan aus (nur Runner)
        working-directory: .
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - uses: actions/checkout@v5

      - name: Projekt vorhanden?
        working-directory: .
        shell: pwsh
        run: |
          if (-not (Test-Path app/src-tauri/tauri.conf.json)) {
            echo "::error::app/src-tauri/tauri.conf.json fehlt. Die App ist noch nicht angelegt."
            exit 1
          }

      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }

      - uses: dtolnay/rust-toolchain@stable

      # Cache wird nur auf main gespeichert. Tag-Läufe sehen nur ihren eigenen Cache,
      # darum Releases per "Run workflow" auf main starten (siehe CLAUDE.md).
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: npm ci --no-audit --no-fund

      - name: Signierzertifikat (optional)
        if: env.WIN_CERT != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WIN_CERT))
          $pass = ConvertTo-SecureString $env:WIN_CERT_PASS -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pass
          Remove-Item $pfx
          @{ bundle = @{ windows = @{ certificateThumbprint = $cert.Thumbprint; digestAlgorithm = "sha256"; timestampUrl = "http://timestamp.digicert.com" } } } | ConvertTo-Json -Depth 5 | Set-Content src-tauri/signing.json

      - name: Bauen
        shell: pwsh
        run: |
          if (Test-Path src-tauri/signing.json) { npx tauri build --bundles nsis --config src-tauri/signing.json }
          else { npx tauri build --bundles nsis }

      # Prüfsumme je Installer (<datei>.sha256), für Nutzer und ein späteres Update in der App.
      - name: Prüfsumme
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe
          if (-not $exe) { echo "::error::Kein Installer gefunden"; exit 1 }
          $exe | ForEach-Object {
            "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)" | Set-Content -NoNewline "$($_.FullName).sha256"
          }
          Get-ChildItem src-tauri/target/release/bundle/nsis

      # Artefakt nur beim Testbuild und nur 1 Tag (zählt zum Speicher-Kontingent).
      - uses: actions/upload-artifact@v7
        if: env.RELEASE != 'true'
        with:
          name: Brickstrap-test-${{ github.run_number }}
          retention-days: 1
          path: |
            app/src-tauri/target/release/bundle/nsis/*-setup.exe
            app/src-tauri/target/release/bundle/nsis/*-setup.exe.sha256

      # Release direkt aus diesem Job: kein zweiter Runner, kein Artefakt-Umweg.
      - name: Release veröffentlichen
        if: env.RELEASE == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: Brickstrap ${{ env.VERSION_TAG }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            app/src-tauri/target/release/bundle/nsis/*-setup.exe
            app/src-tauri/target/release/bundle/nsis/*-setup.exe.sha256
          body: |
            Inoffizieller Launcher für Roblox unter Windows. Kein Produkt von Roblox Corporation.
            Installation: `Brickstrap_<version>_x64-setup.exe` laden und starten. Ohne Code-Signatur warnt SmartScreen: „Weitere Informationen“ → „Trotzdem ausführen“.
            Prüfsumme: `.sha256` neben dem Installer.
