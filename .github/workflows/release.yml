# Release: baut nur die Windows-exe (kein Installer) und hängt sie an ein GitHub-Release.
# Gebaut wird auf Linux per Cross-Compile (cargo-xwin, MSVC-Ziel, offizieller Tauri-Weg):
# Linux-Minuten zählen einfach, Windows-Minuten doppelt. Linux startet und kompiliert zudem schneller.
# Auslöser: "Run workflow" mit Version (nutzt den Cache von main) oder Tag v*. Normale Pushes lösen nichts aus.
# Keine Tests, kein Linting: geprüft wird lokal (siehe CLAUDE.md).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version für das Release, z. B. v0.1.0. Leer = nur Testbuild (Artefakt, 1 Tag), kein Release."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults: { run: { working-directory: app } }
    env:
      VERSION_TAG: ${{ inputs.version || github.ref_name }}
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/') || inputs.version != '' }}
      TARGET: x86_64-pc-windows-msvc
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }

      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-pc-windows-msvc }

      # Fertige Binärdatei statt cargo install (spart Minuten).
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-xwin }

      # Cache nur auf main speichern. Enthält auch die Windows-SDK-Dateien von cargo-xwin.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          cache-directories: ~/.cache/cargo-xwin
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: npm ci --no-audit --no-fund

      - name: Bauen
        run: npx tauri build --runner cargo-xwin --target $TARGET --no-bundle

      - name: exe und Prüfsumme
        run: |
          set -e
          V="${VERSION_TAG#v}"; [ -n "$V" ] && [ "$RELEASE" = true ] || V="test-${{ github.run_number }}"
          mkdir -p out
          src=$(ls src-tauri/target/$TARGET/release/*.exe | head -1)
          cp "$src" "out/Brickstrap_${V}_x64.exe"
          cd out && sha256sum *.exe > "Brickstrap_${V}_x64.exe.sha256" && ls -l

      - uses: actions/upload-artifact@v7
        if: env.RELEASE != 'true'
        with:
          name: Brickstrap-test-${{ github.run_number }}
          retention-days: 1
          path: app/out/*

      - name: Release veröffentlichen
        if: env.RELEASE == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: Brickstrap ${{ env.VERSION_TAG }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: app/out/*
          body: |
            Inoffizieller Launcher für Roblox unter Windows. Kein Produkt von Roblox Corporation.
            `Brickstrap_<version>_x64.exe` laden und starten, keine Installation nötig. Braucht WebView2 (bei Windows 10/11 meist vorhanden).
            Ohne Code-Signatur warnt SmartScreen: „Weitere Informationen“ → „Trotzdem ausführen“.
            Prüfsumme: `.sha256` neben der exe.
